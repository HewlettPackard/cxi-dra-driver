# Default values for the CXI DRA driver chart.

# -- DRA driver name (DNS subdomain). Every cluster/API object this chart creates
# keys off this value, so installing the chart twice with different driverName
# values produces two fully isolated installs. The sanitized form of this name
# (e.g. cxi.slingshot.hpe.com -> cxi-slingshot-hpe-com) is used as the object
# name prefix.
driverName: cxi.slingshot.hpe.com

# -- Override the generated object-name prefix (defaults to the sanitized driverName).
nameOverride: ""
# -- Override the full object name entirely.
fullnameOverride: ""

# -- Namespace for the driver components (workload, ServiceAccount, RBAC, ConfigMap).
# Must be kube-system for the default priorityClassName (system priority classes
# are only usable there).
namespace: kube-system

# -- Pod priority class. system-node-critical keeps the driver running under
# pressure but is only valid in kube-system. Set to "" if installing elsewhere.
priorityClassName: system-node-critical

image:
  # -- Driver image. Published by .github/workflows/build.yaml on every push
  # to main, as a multi-arch (amd64 + arm64) manifest built with `-tags cxi`.
  repository: ghcr.io/bristol-supercomputing/cxi-dra
  # -- `main` tracks the latest build, which is why pullPolicy is Always.
  # Every build is also tagged with its commit sha (e.g. `af87aba`) -- pin one
  # of those, or a `v*` release tag, for a reproducible install.
  tag: main
  pullPolicy: Always

workload:
  # -- DaemonSet (one pod per CXI node) or Deployment (replicas + anti-affinity spread).
  kind: DaemonSet
  # -- Replica count (Deployment only).
  replicas: 10
  antiAffinity:
    # -- Spread pods across distinct nodes. Required to coexist with other installs
    # and to keep two replicas off the same node (fixed kubelet-plugin socket path).
    enabled: true
    # -- Constant label value shared by EVERY install. The anti-affinity selector
    # matches this, so different driver versions never schedule onto the same node.
    # Do not make this unique per release.
    label: cxi-dra-driver

# -- Only schedule on nodes with CXI hardware. Label nodes with:
#    kubectl label node <node> feature.node.kubernetes.io/cxi=true
nodeSelector:
  feature.node.kubernetes.io/cxi: "true"

tolerations: []

# -- Container resource requests/limits.
resources: {}

driver:
  # -- CDI spec output directory (host path). Spec files are named <driverName>-*.json
  # by the driver, so they never collide between installs.
  cdiRoot: /var/run/cdi
  # -- Kubelet plugin socket directory. FIXED / version-independent: anti-affinity
  # guarantees one driver pod per node, and a stable path lets `helm upgrade`
  # cleanly replace the previous version's socket rather than orphan it.
  pluginDir: /var/lib/kubelet/plugins/cxi-dra-driver
  # -- Kubelet plugin registration directory (standard, shared).
  registrarDir: /var/lib/kubelet/plugins_registry
  # -- containerd CDI drop-in path. FIXED for the same reason as pluginDir.
  containerdConfigPath: /etc/containerd/conf.d/50-cxi-cdi.toml
  # -- Host directory under which the NRI plugin builds per-pod synthetic
  # /sys/class/net trees for HSN sysfs injection (so stock libfabric discovers
  # the device). Its parent is mounted writable into the driver. Set to "" to
  # disable HSN sysfs injection.
  netnsSysfsRoot: /var/run/cxi/netns
  # -- Host directory for per-pod CNI hint files: the read-side contract for
  # the Slingshot CNI plugin, written at PrepareResourceClaims time and
  # removed at UnprepareResourceClaims time. Its parent is the same
  # `cxi-state` volume mounted writable for netnsSysfsRoot above. Set to ""
  # to disable the hint-file write/delete.
  cniHintsDir: /var/run/cxi/net-hints
  # -- Add the envConfig host libs and env vars to the env CDI spec (the spec
  # itself, with /dev/kdreg2, /dev/gdrdrv, /dev/xpmem and /dev/shm, is always
  # injected).
  enableCdiEnv: true
  # -- Per-namespace VNI pool.
  vniRange:
    start: 100
    end: 300
  # -- Blessed system services present on every node — typically the default
  # service (svc_id 1) and the Ethernet service(s). These are never torn down by
  # the driver, and their actual reserved resources are deducted from each
  # device's usable ceiling. Populate from `cxi_service list` on a node. An empty
  # list blesses nothing: the driver reserves no capacity and may reap
  # pre-existing services.
  systemSvcIDs: [1, 2, 3, 4]
  # -- Extra raw args appended to the driver command.
  extraArgs: []

deviceClass:
  # -- Render the DeviceClass that selects this install's ResourceSlices.
  enabled: true

# Optional Slingshot CNI plugin (slingshot-cni). Gives each CXI-claiming pod an
# L2 IPVLAN netdev on its HSN with a Whereabouts-assigned address — see
# docs/cni/cni-plugin.md. Entirely OPT-IN: a site may instead keep hostNetwork
# pods, or (future) SR-IOV VFs, and the driver behaves identically with the
# CNI absent. Everything below is off by default and renders nothing.
cni:
  # -- Install the slingshot-cni binary bundled in the driver image onto each
  # node's CNI plugin directory at driver startup (atomic temp-file + rename,
  # re-done on every restart so upgrades roll the plugin too). Adds a hostPath
  # mount of `binDir` to the driver pod. The binary is left in place on
  # uninstall — removing a CNI plugin from under running pods is unsafe.
  install: false
  # -- Host CNI plugin directory (containerd's CNI_PATH / bin_dir).
  binDir: /opt/cni/bin
  nad:
    # -- Render a NetworkAttachmentDefinition for slingshot-cni. Requires
    # Multus (for the k8s.cni.cncf.io/v1 CRD and per-pod attachment) and the
    # Whereabouts binary + CRDs on the cluster; neither is installed by this
    # chart. Pods opt in with the annotation
    #   k8s.v1.cni.cncf.io/networks: <namespace>/<name>
    create: false
    # -- NAD name.
    name: slingshot-hsn
    # -- Namespaces to render the NAD into (one copy each). Falls back to
    # `resourceClaimTemplates.namespaces` when empty, so the network exists
    # wherever the claim templates do.
    namespaces: []
    # -- Passed through verbatim as the NAD's `ipam` block; any Whereabouts
    # option (range, exclude, range_start, range_end, …) goes here.
    # `type` is required by slingshot-cni.
    ipam:
      type: whereabouts
      range: 10.200.0.0/16
    # -- Hint-file polling bounds while waiting for the driver's hint file
    # (a safety net; see docs/cni/cnidra-cni-hint-contract.md). Empty uses the
    # plugin defaults (100ms / 5s).
    retryInterval: ""
    retryTimeout: ""

admissionPolicy:
  # -- Render the MutatingAdmissionPolicies + Bindings that convert legacy opaque
  # resource config (txqs, ..., le_pools, tle_pools) on claims for this install's
  # driver into consumable-capacity requests, and that append the namespace-VNI
  # selector to every claim request for this install's DeviceClass.
  enabled: true
  # -- Namespaces the policy does NOT mutate.
  excludedNamespaces:
    - kube-system

envConfig:
  # -- Render the env.json ConfigMap for the "env" CDI spec, which is attached to
  # every CXI device alongside /dev/cxiN (it always carries /dev/kdreg2,
  # /dev/gdrdrv, /dev/xpmem and /dev/shm). With driver.enableCdiEnv it also
  # injects the host libfabric/libcxi below, bind-mounted read-only at
  # /host/env/<basename>, and the env vars. Host paths are site-specific —
  # override below. NCCL and aws-ofi-nccl are injected by k8s-modules (pod
  # annotation modules.brics.ac.uk/load).
  enabled: true
  json:
    # -- createContainer hook (cxi-cdi-hook, installed on the node by the driver)
    # that adds /host/env to the container ldcache.
    ldcache:
      enabled: true
    libs:
      - "/opt/cray/libfabric/2.3.1/lib64/libfabric.so.1"
      - "/usr/lib64/libcxi.so.1"
      - "/usr/lib64/libcurl.so.4"
      - "/usr/lib64/libjson-c.so.5"
      - "/usr/lib64/libatomic.so.1"
      - "/usr/lib64/libnl-3.so.200"
      - "/usr/lib64/libnghttp2.so.14"
      - "/usr/lib64/libidn2.so.0"
      - "/usr/lib64/libssh.so.4"
      - "/usr/lib64/libpsl.so.5"
      - "/usr/lib64/libssl.so.3"
      - "/usr/lib64/libcrypto.so.3"
      - "/usr/lib64/libgssapi_krb5.so.2"
      - "/usr/lib64/libldap_r-2.4.so.2"
      - "/usr/lib64/liblber-2.4.so.2"
      - "/usr/lib64/libzstd.so.1"
      - "/usr/lib64/libbrotlidec.so.1"
      - "/usr/lib64/libz.so.1"
      - "/usr/lib64/libunistring.so.2"
      - "/usr/lib64/libjitterentropy.so.3"
      - "/usr/lib64/libkrb5.so.3"
      - "/usr/lib64/libk5crypto.so.3"
      - "/lib64/libcom_err.so.2"
      - "/usr/lib64/libkrb5support.so.0"
      - "/usr/lib64/libsasl2.so.3"
      - "/usr/lib64/libbrotlicommon.so.1"
      - "/usr/lib64/libkeyutils.so.1"
      - "/usr/lib64/libpcre.so.1"
      - "/opt/xpmem/lib64/libxpmem.so.0"
    # -- Env vars for every CXI container. CXIP_SKIP_AMA_CHECK=1 lets stock
    # libfabric accept the synthetic HSN netdev.
    env:
      - "CXIP_SKIP_AMA_CHECK=1"

resourceClaimTemplates:
  # -- Render the ResourceClaimTemplates. Each is named <name-prefix>-<template name>
  # (e.g. cxi-slingshot-hpe-com-small) and points at this install's DeviceClass.
  enabled: true
  # -- Namespaces the templates live in (workload-facing). Each template is
  # rendered once per namespace. Falls back to the singular `namespace` below
  # when this list is empty.
  namespaces:
    - default
  # -- Deprecated single-namespace setting, used only when `namespaces` is empty.
  namespace: default
  # Each template's params become capacity requests (le_pools x 1024 = les,
  # tle_pools x 512 = tles). Omitted fields consume the device default.
  # VF mode (--vf-only): parents publish 0 LEs/TLEs, so the scheduler rejects
  # every template below that sets a non-zero le_pools or tle_pools; override
  # them with le_pools: 0 / tle_pools: 0 for VF nodes.
  templates:
    # cxi-small — benchmarks, fi_pingpong, development, simple single-threaded tools.
    - name: small
      params:
        txqs: 4
        tgqs: 2
        eqs: 8
        cts: 4
        ptes: 4
        acs: 2
        le_pools: 1
        tle_pools: 1
    # cxi-medium — standard MPI jobs, NCCL at moderate scale, typical HPC workloads.
    - name: medium
      params:
        txqs: 16
        tgqs: 8
        eqs: 32
        cts: 32
        ptes: 16
        acs: 8
        le_pools: 2
        tle_pools: 1
    # cxi-large — multi-threaded MPI, NCCL at scale, collectives-heavy workloads.
    - name: large
      params:
        txqs: 64
        tgqs: 32
        eqs: 128
        cts: 256
        ptes: 64
        acs: 32
        le_pools: 4
        tle_pools: 2
    # cxi-whole — exclusive device access; full NIC after the system-svc reservation.
    - name: whole
      params:
        txqs: 1019
        tgqs: 507
        eqs: 2037
        cts: 2047
        ptes: 2036
        acs: 1018
        le_pools: 14
        tle_pools: 3
    # cxi-2-small — two devices (ExactCount) with the small profile.
    - name: 2-small
      count: 2
      params:
        txqs: 4
        tgqs: 2
        eqs: 8
        cts: 4
        ptes: 4
        acs: 2
        le_pools: 1
        tle_pools: 1
    - name: 2-whole
      count: 2
      params:
        txqs: 1019
        tgqs: 507
        eqs: 2037
        cts: 2047
        ptes: 2036
        acs: 1018
        le_pools: 14
        tle_pools: 3
