{{- if .Values.admissionPolicy.enabled }}
{{- $driver := include "cxi-dra.driverName" . }}
{{- $fullname := include "cxi-dra.fullname" . }}
---
# MutatingAdmissionPolicy: convert legacy CXI opaque resource config into
# consumable-capacity requests, so claims written for the opaque-config API
# keep working now that devices publish capacity.
#
# Devices publish txqs/tgqs/eqs/cts/ptes/acs/les/tles as consumable capacity
# and the scheduler charges each allocation's requests against them. A claim
# that only carries opaque config would otherwise consume the capacity
# defaults, and the driver rejects it at prepare time because the opaque
# config asks for more than was allocated.
#
# This runs in-process in the API server — no webhook, no TLS, no network routing.
#
# Logic:
#   - Intercept ResourceClaim CREATE in any namespace except the excluded ones
#   - Match only claims whose first request is "exactly" with no capacity
#     requests yet, and whose config[0] is this driver's opaque config
#   - Add exactly.capacity.requests with one entry per resource field present
#     in the opaque parameters; absent fields fall back to the device's
#     requestPolicy default
#
# LE/TLE pool conversion (must match LEPoolSize/TLEPoolSize in internal/cxi/resources.go):
#   le_pools  * 1024 = les   (LEPoolSize)
#   tle_pools * 512  = tles  (TLEPoolSize)
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ include "cxi-dra.fullname" . }}-capacity-conversion
  labels:
    {{- include "cxi-dra.labels" . | nindent 4 }}
spec:
  failurePolicy: Ignore  # never block claim creation if the policy errors
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups:   ["resource.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE"]
        resources:   ["resourceclaims"]
  matchConditions:
    # Only process claims with at least one device request.
    - name: has-requests
      expression: >
        object.spec.devices.requests.size() >= 1

    # Only process claims whose first request has exactly set but no capacity
    # requests yet (the user's own capacity requests win).
    - name: no-existing-capacity
      expression: >
        has(object.spec.devices.requests[0].exactly) &&
        !has(object.spec.devices.requests[0].exactly.capacity)

    # Only process claims where config[0] is our driver's opaque config.
    - name: has-cxi-config
      expression: >
        has(object.spec.devices.config) &&
        object.spec.devices.config.size() > 0 &&
        has(object.spec.devices.config[0].opaque) &&
        object.spec.devices.config[0].opaque.driver == "{{ $driver }}"

  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity",
                     value: {"requests": {}}}] +
          (has(object.spec.devices.config[0].opaque.parameters.txqs)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/txqs",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.txqs))}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.tgqs)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/tgqs",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.tgqs))}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.eqs)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/eqs",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.eqs))}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.cts)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/cts",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.cts))}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.ptes)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/ptes",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.ptes))}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.acs)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/acs",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.acs))}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.le_pools)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/les",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.le_pools) * 1024)}]
            : []) +
          (has(object.spec.devices.config[0].opaque.parameters.tle_pools)
            ? [JSONPatch{op: "add", path: "/spec/devices/requests/0/exactly/capacity/requests/tles",
                         value: string(int(object.spec.devices.config[0].opaque.parameters.tle_pools) * 512)}]
            : [])
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ include "cxi-dra.fullname" . }}-capacity-conversion-binding
  labels:
    {{- include "cxi-dra.labels" . | nindent 4 }}
spec:
  policyName: {{ include "cxi-dra.fullname" . }}-capacity-conversion
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml .Values.admissionPolicy.excludedNamespaces | nindent 12 }}
---

{{- if .Values.cni.nad.create }}
# MutatingAdmissionPolicy: automatically attach the Slingshot network to Pods
# that reference one of this driver's CXI ResourceClaimTemplates.
#
# Logic:
#   - Intercept Pod CREATE
#   - Match Pods with at least one resourceClaim
#   - Match when a ResourceClaimTemplate name starts with <fullname>-
#   - Skip Pods that already define the Multus networks annotation
#   - Inject <namespace>/<configured NAD name> as the Multus secondary network
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-slingshot-network-injection
  labels:
    {{- include "cxi-dra.labels" . | nindent 4 }}
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    # Only process Pods that declare ResourceClaims.
    - name: has-resource-claims
      expression: >
        has(object.spec.resourceClaims) &&
        object.spec.resourceClaims.size() > 0

    # Match Pods that reference one of this chart's CXI ResourceClaimTemplates.
    # Templates are named <fullname>-<template>, for example:
    # cxi-slingshot-hpe-com-small.
    - name: has-cxi-resource-claim-template
      expression: >
        object.spec.resourceClaims.exists(rc,
          has(rc.resourceClaimTemplateName) &&
          rc.resourceClaimTemplateName.startsWith("{{ $fullname }}-")
        )

    # Preserve a Multus network selection explicitly supplied by the user.
    - name: no-existing-multus-network
      expression: >
        !has(object.metadata.annotations) ||
        !("k8s.v1.cni.cncf.io/networks" in object.metadata.annotations)

  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          !has(object.metadata.annotations)
          ? [
              JSONPatch{
                op: "add",
                path: "/metadata/annotations",
                value: {
                  "k8s.v1.cni.cncf.io/networks":
                    object.metadata.namespace + "/{{ .Values.cni.nad.name }}"
                }
              }
            ]
          : [
              JSONPatch{
                op: "add",
                path: "/metadata/annotations/" +
                      jsonpatch.escapeKey("k8s.v1.cni.cncf.io/networks"),
                value:
                  object.metadata.namespace + "/{{ .Values.cni.nad.name }}"
              }
            ]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-slingshot-network-injection-binding
  labels:
    {{- include "cxi-dra.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-slingshot-network-injection
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml .Values.admissionPolicy.excludedNamespaces | nindent 12 }}
{{- end }}

{{- end }}