apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cxi-dra.fullname" . }}
  labels:
    {{- include "cxi-dra.labels" . | nindent 4 }}
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    # Authorises the UpdateStatus HTTP call itself.
    resources: ["resourceclaims/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    # "resourceclaims/driver" is a logical RBAC resource (no HTTP endpoint).
    # The DRA admission plugin does two SubjectAccessReviews when status.devices
    # is modified via UpdateStatus:
    #   1. verb=associated-node:update  (granted to kubelets by the NodeAuthorizer)
    #   2. verb=arbitrary-node:update   (granted to controllers/service-accounts here)
    # Standard "update"/"patch" verbs on this subresource do NOT satisfy either
    # check — the literal colon-verb strings must be granted explicitly.
    resources: ["resourceclaims/driver"]
    verbs: ["update", "patch", "associated-node:update", "arbitrary-node:update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # The namespace VNI allocator (leader-elected) watches every namespace, scans
  # for the <driver-name>/vni annotation, and patches an assignment onto any
  # namespace that lacks one. The kubelet plugin (prepare.go) Gets each pod's
  # namespace to resolve its VNI before recording it on the pod allocation.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cxi-dra.fullname" . }}
  labels:
    {{- include "cxi-dra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cxi-dra.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cxi-dra.fullname" . }}
    namespace: {{ .Values.namespace }}
