{{- if .Values.resourceClaimTemplates.enabled }}
{{- $root := . }}
{{- $deviceClass := include "cxi-dra.deviceClassName" . }}
{{- $fullname := include "cxi-dra.fullname" . }}
{{- $namespaces := .Values.resourceClaimTemplates.namespaces }}
{{- if not $namespaces }}
{{- $namespaces = list .Values.resourceClaimTemplates.namespace }}
{{- end }}
{{- range $ns := $namespaces }}
{{- range $tpl := $root.Values.resourceClaimTemplates.templates }}
---
# {{ $fullname }}-{{ $tpl.name }} (ns: {{ $ns }}) — one ResourceClaim per pod
# allocating CXI NIC(s). The fabric VNI is NOT part of the claim: it is assigned
# per-namespace by the leader-elected allocator and read at prepare time.
# Resources are consumable-capacity requests charged against the device by the
# scheduler; le_pools/tle_pools in values are converted to absolute LEs/TLEs.
# A field left out of params consumes the device's requestPolicy default.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ $fullname }}-{{ $tpl.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "cxi-dra.labels" $root | nindent 4 }}
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: {{ $deviceClass }}
            {{- if $tpl.count }}
            allocationMode: ExactCount
            count: {{ $tpl.count }}
            {{- end }}
            capacity:
              requests:
                {{- range $k, $v := $tpl.params }}
                {{- if eq $k "le_pools" }}
                les: {{ mul $v 1024 | quote }}
                {{- else if eq $k "tle_pools" }}
                tles: {{ mul $v 512 | quote }}
                {{- else }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
                {{- end }}
{{- end }}
{{- end }}
{{- end }}
