# 8-pod ReplicaSet pinned to two nodes — exercises BindingConditions gating
# and Unschedulable compaction at full device capacity.
#
# 2 nodes × 4 CXI devices × 4 cxi-small slots = 8 pods capacity
# (One pod per namespace per device)
#
# Each pod uses the single-CXI cxi-small template. The fabric VNI is
# namespace-scoped (assigned once by the namespace VNI allocator) and read at
# prepare time, so it is not part of the claim. This one-claim-per-pod model
# is what lets Unschedulable compaction work cleanly: when the ClaimBinder
# sets Unschedulable=True on an over-subscribed device, the scheduler
# deallocates the single CXI claim and retries on a less-loaded device — no
# second claim is left in a partial-allocation state, so the DRA Score
# plugin cannot hit the "N allocations < N claims" mismatch.
#
# Library injection is handled entirely by CDI (cdi_profiles: ["env"] on the
# cxi-small template injects libfabric, libcxi, libxpmem + transitive deps
# and updates ld.so.cache). NRI injects SLINGSHOT_DEVICES/VNIS/SVC_IDS env
# vars. The only hostPath here is the patched libfabric install carrying the
# fi_* binaries — its /fi/lib/libfabric.so.1 is the same build CDI injects
# at /usr/lib64/libfabric.so.1, so there is no ABI drift.
#
# Apply pre-requisites first:
#   kubectl apply -f deploy/kubernetes/test/resourceclaim.yaml
#
# Inspect placement:
#   kubectl get pods -l app=cxi-2node-test -o wide
#   kubectl get resourceclaims -o wide
#
# To switch nodes, edit the values under nodeAffinity below.
# To clean up: kubectl delete replicaset cxi-2node-test
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: cxi-2node-test
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: cxi-2node-test
  template:
    metadata:
      labels:
        app: cxi-2node-test
    spec:
      restartPolicy: Always

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nid001006
                      - nid001005

      resourceClaims:
        - name: cxi
          resourceClaimTemplateName: cxi-small

      containers:
        - name: workload
          image: ubuntu:24.04
          command: ["sleep", "3600"]
          resources:
            claims:
              - name: cxi
          env:
            - name: PATH
              value: "/fi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          volumeMounts:
            - name: fi-install
              mountPath: /fi

      volumes:
        - name: fi-install
          hostPath:
            path: /home/vendor/pirese.vendor/source/libfabric/install
            type: Directory
