# Two-node test: 24-pod ReplicaSet pinned to two nodes only.
#
# 2 nodes × 4 CXI devices × 3 cxi-quarter slots = 24 pods capacity.
# Useful for testing scale-down/scale-up VNI cleanup in isolation.
#
# Each pod uses the merged cxi-quarter-with-vni template — CXI device and
# fabric VNI in a single claim. This is required for Unschedulable compaction
# to work correctly: when the ClaimBinder sets Unschedulable=True on an
# over-subscribed device, the scheduler deallocates the entire merged claim
# (CXI + VNI together), so the retry starts with a clean allocation on a
# less-loaded device. With separate claims the VNI allocation would survive
# the deallocation, causing Score errors on retry.
#
# To switch nodes, edit the values under nodeAffinity below.
# To clean up: kubectl delete replicaset cxi-2node-test
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: cxi-2node-test
  namespace: default
spec:
  replicas: 24
  selector:
    matchLabels:
      app: cxi-2node-test
  template:
    metadata:
      labels:
        app: cxi-2node-test
    spec:
      restartPolicy: Always

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nid001018
                      - nid001019

      # Each pod gets its own ephemeral merged cxi-quarter-with-vni claim
      # (CXI device + fabric VNI allocated atomically in one ResourceClaim).
      resourceClaims:
        - name: cxi
          resourceClaimTemplateName: cxi-quarter-with-vni
      
      containers:
        - name: workload
          image: ubuntu:24.04
          command: ["sh", "-c"]
          args:
            - |
              echo "=== CXI devices ==="
              ls -la /dev/cxi* || echo "none"
              echo "=== CXI service files (from NRI plugin) ==="
              ls -la /run/cxi/ || echo "none"
              cat /run/cxi/cxi0-service.yaml 2>/dev/null || echo "no service file for cxi0"
              echo "=== libfabric providers ==="
              /extras/bin/fi_info --provider cxi 2>&1 || echo "fi_info not found or no CXI provider"
              sleep 3600
          resources:
            claims:
              - name: cxi
          env:
            - name: LD_LIBRARY_PATH      
              value: "/usr/lib64/:/extras/lib/:/hostlibs:/xpmem/lib64"
            - name: CXIP_DEFAULT_LINK
              value: "1"
            - name: CXIP_DEFAULT_SPEED
              value: "200000"
            - name: CXIP_SKIP_AMA_CHECK
              value: "1"
          volumeMounts:
            - name: libcxi
              mountPath: /hostlibs
            - name: build
              mountPath: /extras
            - name: xpmem
              mountPath: /xpmem/lib64
      volumes:
        - name: libcxi
          hostPath:
            path: /usr/lib64/
            type: Directory
        - name: xpmem
          hostPath:
            path: /opt/xpmem/lib64
            type: Directory
        - name: build
          hostPath:
            path: /home/brics/jwatson.brics/k8s-on-compute/shs-libfabric/build-output
            type: Directory

