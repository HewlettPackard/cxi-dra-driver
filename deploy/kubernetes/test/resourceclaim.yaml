# CXI ResourceClaimTemplates with explicit resource allocation.
#
# Each pod gets one ResourceClaim that allocates a single CXI device. The
# fabric VNI is NOT part of the claim: it is assigned per-namespace by the
# leader-elected namespace VNI allocator and read at prepare time, so every
# pod in a namespace shares the namespace's VNI for RDMA.
#
# This one-claim-per-pod model is what makes the Unschedulable compaction
# path correct: when the ClaimBinder sets Unschedulable=True on an
# over-subscribed device, the scheduler deallocates the single CXI claim
# and retries on a less-loaded device — there is no second claim to leave
# in a partially-allocated state, so the DRA Score plugin cannot hit the
# "number of allocations N is smaller than number of claims" mismatch.
#
# All resource fields are required — the driver has no defaults. Claims
# without opaque config will be rejected at prepare time with a clear error.
#
# LEs and TLEs are expressed as pool counts:
#   le_pools:  1 pool = 1024 LEs
#   tle_pools: 1 pool = 512  TLEs
#
# cdi_profiles is also required. It is the list of optional CDI specs that
# get injected into the pod alongside the per-device node:
#   "env"          — libcxi/libfabric and the rest of the userspace runtime
#   "nccl"         — NCCL libraries from the configured Spack prefix
#   "aws-ofi-nccl" — AWS-OFI NCCL plugin and tuning env vars
# Use [] if the pod brings its own runtime libraries and only needs /dev/cxiN.
---
# CXI quarter-device. Requests four LE pools (4096 LEs) and one TLE pool
# (512 TLEs); set le_pools/tle_pools to 0 if your job does not use
# triggered operations.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-quarter
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 256
              tgqs: 128
              eqs: 511
              cts: 511
              ptes: 512
              acs: 255
              le_pools: 4
              tle_pools: 1
              cdi_profiles: ["env"]
---
# CXI half-device with full NCCL + AWS-OFI runtime injected. For
# bandwidth-intensive collective jobs.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-half
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 512
              tgqs: 256
              eqs: 1023
              cts: 1023
              ptes: 1024
              acs: 511
              le_pools: 8
              tle_pools: 2
              cdi_profiles: ["env", "nccl", "aws-ofi-nccl"]
---
# CXI quarter-device with NO injected runtime — only /dev/cxiN. Use when
# the pod's container image already carries libfabric/libcxi.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-quarter-bare
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 256
              tgqs: 128
              eqs: 511
              cts: 511
              ptes: 512
              acs: 255
              le_pools: 4
              tle_pools: 1
              cdi_profiles: []
