# CXI ResourceClaimTemplates — four single-device sizes (small/medium/large/
# whole) plus two multi-device variants (2-small/2-whole), one claim per pod.
#
# Each pod gets one ResourceClaim that allocates one or more CXI NICs (the
# cxi-2-* templates request two via ExactCount). The fabric VNI is NOT part of
# the claim: it is assigned per-namespace by the leader-elected namespace VNI
# allocator and read at prepare time, so every pod in a namespace shares the
# namespace's VNI for RDMA.
#
# This one-claim-per-pod model is what makes the Unschedulable compaction
# path correct: when the ClaimBinder sets Unschedulable=True on an
# over-subscribed device, the scheduler deallocates the single CXI claim
# and retries on a less-loaded device — there is no second claim to leave
# in a partially-allocated state, so the DRA Score plugin cannot hit the
# "number of allocations N is smaller than number of claims" mismatch.
#
# Resources are consumable-capacity requests: each device publishes txqs,
# tgqs, eqs, cts, ptes, acs, les and tles as capacity, and the scheduler
# charges every allocation's requests against it. A resource left out of
# capacity.requests consumes the device default (the cxi-small queue sizes,
# 0 LEs/TLEs). LEs and TLEs are absolute counts; the scheduler rounds them up
# to whole pools (1024 LEs, 512 TLEs). Claims still using the old opaque
# config (le_pools/tle_pools etc.) are converted by the admission policy.
#
# Parameter reference (concise — see README "Resource field reference" for
# the source-grounded explanation of what each field actually controls):
#   txqs      — Transmit command queues; the libfabric provider shares one
#               per endpoint (control + TX context reuse the same CMDQ).
#   tgqs      — Target (receive-side) command queues; same shared-per-endpoint
#               model as txqs.
#   eqs       — Hardware event queues; libfabric allocates 4 per endpoint
#               (TX data, RX data, TX ctrl, TGT ctrl), so 8 is a safe floor.
#   cts       — Hardware counters; only consumed when the application opens
#               a libfabric counter (fi_cntr_open) — NCCL/MPI: 64–256,
#               simple benchmarks: 0.
#   ptes      — Portal table entries; 2 unconditional per endpoint (control +
#               RX) plus memory regions / rendezvous / collectives on demand.
#   acs       — Address contexts (memory protection / IOMMU); reused via the
#               libfabric MR cache so typical jobs need only a few.
#   les       — List entries, in pools of 1024. 0 = use the shared
#               default pool (best effort); >0 = reserve whole pools exclusively
#               for guaranteed capacity under contention.
#   tles      — Triggered list entries, in pools of 512. 0 = shared
#               default; only triggered operations (NCCL allreduce trees,
#               counter-triggered MPI collectives) consume TLEs.
#
# CDI injection needs no parameter: every device also gets the driver's env
# spec (/dev/kdreg2, /dev/gdrdrv, /dev/xpmem, /dev/shm, and with
# --enable-cdi-env the host libfabric/libcxi under /host/env plus
# CXIP_SKIP_AMA_CHECK=1). NCCL and aws-ofi-nccl come from k8s-modules (pod
# annotation modules.brics.ac.uk/load, e.g. "aws-ofi-nccl-1.18.0"). The old
# cdi_profiles field is deprecated: only ["env"] is still accepted.
#
# Per-device resources visible to claims under the daemonset's current
# --system-svc-ids policy (see deploy/kubernetes/daemonset.yaml):
#   TXQs 1019 · TGQs 507 · EQs 2037 · CTs 2047 · PTEs 2036 · ACs 1018
#   LEs 14336 (14 pools) · TLEs 1536 (3 pools)
# --system-svc-ids names the blessed system services already running on the
# node; their reserved resources are deducted from the usable ceiling. Adjust
# the list in daemonset.yaml if your node's actual system services differ.
#
---
# cxi-small — benchmarks, fi_pingpong, development, simple single-threaded tools.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-small
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
            capacity:
              requests:
                txqs: "4"
                tgqs: "2"
                eqs: "8"
                cts: "4"
                ptes: "4"
                acs: "2"
                les: "1024"
                tles: "512"
---
# cxi-medium — standard MPI jobs, NCCL at moderate scale, typical HPC workloads.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-medium
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
            capacity:
              requests:
                txqs: "16"
                tgqs: "8"
                eqs: "32"
                cts: "32"
                ptes: "16"
                acs: "8"
                les: "2048"
                tles: "512"
---
# cxi-large — multi-threaded MPI, NCCL at scale, collectives-heavy workloads,
#             or jobs that generate many concurrent unexpected messages.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-large
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
            capacity:
              requests:
                txqs: "64"
                tgqs: "32"
                eqs: "128"
                cts: "256"
                ptes: "64"
                acs: "32"
                les: "4096"
                tles: "1024"
---
# cxi-whole — exclusive device access; for a single demanding workload that
#             needs the full NIC (all resources remaining after the daemonset's
#             --system-svc-ids reservation).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-whole
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
            capacity:
              requests:
                txqs: "1019"
                tgqs: "507"
                eqs: "2037"
                cts: "2047"
                ptes: "2036"
                acs: "1018"
                les: "14336"
                tles: "1536"
---
# cxi-2-small — two devices (ExactCount) with the small profile; for ranks that
#               drive a pair of NICs but only need lightweight per-device state.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-2-small
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
            allocationMode: ExactCount
            count: 2
            capacity:
              requests:
                txqs: "4"
                tgqs: "2"
                eqs: "8"
                cts: "4"
                ptes: "4"
                acs: "2"
                les: "1024"
                tles: "512"
---
# cxi-2-whole — two devices (ExactCount), each the full post-reservation NIC;
#               for a single workload that saturates a pair of NICs.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-2-whole
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
            allocationMode: ExactCount
            count: 2
            capacity:
              requests:
                txqs: "1019"
                tgqs: "507"
                eqs: "2037"
                cts: "2047"
                ptes: "2036"
                acs: "1018"
                les: "14336"
                tles: "1536"
