# CXI ResourceClaimTemplates — one per pod, four sizes.
#
# Each pod gets one ResourceClaim that allocates a single CXI NIC. The fabric
# VNI is NOT part of the claim: it is assigned per-namespace by the
# leader-elected namespace VNI allocator and read at prepare time, so every
# pod in a namespace shares the namespace's VNI for RDMA.
#
# This one-claim-per-pod model is what makes the Unschedulable compaction
# path correct: when the ClaimBinder sets Unschedulable=True on an
# over-subscribed device, the scheduler deallocates the single CXI claim
# and retries on a less-loaded device — there is no second claim to leave
# in a partially-allocated state, so the DRA Score plugin cannot hit the
# "number of allocations N is smaller than number of claims" mismatch.
#
# All resource fields PLUS cdi_profiles are required — the driver has no
# defaults. Claims without opaque config (or with any missing field) will
# be rejected at prepare time with a clear error.
#
# Parameter reference (concise — see README "Resource field reference" for
# the source-grounded explanation of what each field actually controls):
#   txqs      — Transmit command queues; the libfabric provider shares one
#               per endpoint (control + TX context reuse the same CMDQ).
#   tgqs      — Target (receive-side) command queues; same shared-per-endpoint
#               model as txqs.
#   eqs       — Hardware event queues; libfabric allocates 4 per endpoint
#               (TX data, RX data, TX ctrl, TGT ctrl), so 8 is a safe floor.
#   cts       — Hardware counters; only consumed when the application opens
#               a libfabric counter (fi_cntr_open) — NCCL/MPI: 64–256,
#               simple benchmarks: 0.
#   ptes      — Portal table entries; 2 unconditional per endpoint (control +
#               RX) plus memory regions / rendezvous / collectives on demand.
#   acs       — Address contexts (memory protection / IOMMU); reused via the
#               libfabric MR cache so typical jobs need only a few.
#   le_pools  — List-entry pools (1 pool = 1024 LEs). 0 = use the shared
#               default pool (best effort); >0 = reserve N pools exclusively
#               for guaranteed capacity under contention.
#   tle_pools — Triggered list-entry pools (1 pool = 512 TLEs). 0 = shared
#               default; only triggered operations (NCCL allreduce trees,
#               counter-triggered MPI collectives) consume TLEs.
#
# cdi_profiles — required list of optional CDI specs to inject into the pod
#                alongside the per-device /dev/cxiN node:
#   "env"          — libcxi / libfabric / userspace runtime libraries
#   "nccl"         — NCCL libraries from the configured Spack prefix
#   "aws-ofi-nccl" — AWS-OFI NCCL plugin and tuning env vars
#   []             — no injection; use when the container image already
#                    carries libfabric/libcxi (BYO runtime)
#
# Per-device resources visible to claims under the daemonset's current
# --system-svc-ids policy (see deploy/kubernetes/daemonset.yaml):
#   TXQs 1019 · TGQs 507 · EQs 2037 · CTs 2047 · PTEs 2036 · ACs 1018
#   le_pools 14 (14336 LEs) · tle_pools 3 (1536 TLEs)
# --system-svc-ids names the blessed system services already running on the
# node; their reserved resources are deducted from the usable ceiling. Adjust
# the list in daemonset.yaml if your node's actual system services differ.
#
---
# cxi-small — benchmarks, fi_pingpong, development, simple single-threaded tools.
# Injects libfabric/libcxi only; add nccl/aws-ofi-nccl if the workload needs them.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-small
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 4
              tgqs: 2
              eqs: 8
              cts: 4
              ptes: 4
              acs: 2
              le_pools: 1
              tle_pools: 1
              cdi_profiles: ["env"]
---
# cxi-medium — standard MPI jobs, NCCL at moderate scale, typical HPC workloads.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-medium
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 16
              tgqs: 8
              eqs: 32
              cts: 32
              ptes: 16
              acs: 8
              le_pools: 2
              tle_pools: 1
              cdi_profiles: ["env", "nccl", "aws-ofi-nccl"]
---
# cxi-large — multi-threaded MPI, NCCL at scale, collectives-heavy workloads,
#             or jobs that generate many concurrent unexpected messages.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-large
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 64
              tgqs: 32
              eqs: 128
              cts: 256
              ptes: 64
              acs: 32
              le_pools: 4
              tle_pools: 2
              cdi_profiles: ["env", "nccl", "aws-ofi-nccl"]
---
# cxi-whole — exclusive device access; for a single demanding workload that
#             needs the full NIC (all resources remaining after the daemonset's
#             --system-svc-ids reservation).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-whole
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 1019
              tgqs: 507
              eqs: 2037
              cts: 2047
              ptes: 2036
              acs: 1018
              le_pools: 14
              tle_pools: 3
              cdi_profiles: ["env", "nccl", "aws-ofi-nccl"]
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  annotations:
  name: cxi-2-small
  namespace: default
spec:
  metadata: {}
  spec:
    devices:
      config:
      - opaque:
          driver: cxi.slingshot.hpe.com
          parameters:
            acs: 2
            cdi_profiles:
            - env
            cts: 4
            eqs: 8
            le_pools: 1
            ptes: 4
            tgqs: 2
            tle_pools: 1
            txqs: 4
        requests:
        - cxi
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 2
          deviceClassName: cxi-device
        name: cxi
