# CXI ResourceClaimTemplates with explicit resource allocation.
#
# All resource fields are required — the driver has no defaults. Claims
# without opaque config will be rejected at prepare time with a clear error.
#
# LEs and TLEs are expressed as pool counts:
#   le_pools:  1 pool = 1024 LEs
#   tle_pools: 1 pool = 512  TLEs
#
# Each pod uses a single merged template that combines the CXI device request
# and the fabric VNI allocation in one ResourceClaim. This is required for
# Unschedulable compaction to work correctly: when the ClaimBinder sets
# Unschedulable=True on an over-subscribed device the scheduler deallocates
# the entire claim (CXI + VNI together) atomically, so the pod retries with
# a clean allocation on a less-loaded device.
---
# Merged quarter+VNI: allocates a CXI quarter-device and a fabric VNI in a
# single ResourceClaim. Suitable for most jobs. Requests four LE pools
# (4096 LEs) and one TLE pool (512 TLEs); set le_pools/tle_pools to 0 if
# your job does not use triggered operations.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-quarter-with-vni
  namespace: default
spec:
  spec:
    devices:
      requests:
        # CXI device request must be first: the MutatingAdmissionPolicy
        # injects avail_* selectors into requests[0] (the CXI request).
        - name: cxi
          exactly:
            deviceClassName: cxi-device
        - name: vni
          exactly:
            deviceClassName: cxi-vni
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 256
              tgqs: 128
              eqs: 511
              cts: 511
              ptes: 512
              acs: 255
              le_pools: 4
              tle_pools: 1
---
# Merged half+VNI: allocates a CXI half-device and a fabric VNI in a single
# ResourceClaim. For bandwidth-intensive jobs needing more queues or LE pools.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cxi-half-with-vni
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: cxi
          exactly:
            deviceClassName: cxi-device
        - name: vni
          exactly:
            deviceClassName: cxi-vni
      config:
        - requests: ["cxi"]
          opaque:
            driver: cxi.slingshot.hpe.com
            parameters:
              txqs: 512
              tgqs: 256
              eqs: 1023
              cts: 1023
              ptes: 1024
              acs: 511
              le_pools: 8
              tle_pools: 2
