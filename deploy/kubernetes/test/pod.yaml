# Single-pod smoke test for a cxi-small claim.
#
# Library injection is handled entirely by CDI (cdi_profiles: ["env"] on the
# cxi-small template injects libfabric, libcxi, libxpmem + transitive deps
# and updates ld.so.cache). NRI injects SLINGSHOT_DEVICES/VNIS/SVC_IDS env
# vars. The only hostPath here is the patched libfabric install carrying the
# fi_* binaries — its /fi/lib/libfabric.so.1 is the same build CDI injects
# at /usr/lib64/libfabric.so.1, so there is no ABI drift.
#
# Apply pre-requisites first:
#   kubectl apply -f deploy/kubernetes/test/resourceclaim.yaml
#
# Useful diagnostics once the pod is Running:
#   kubectl exec cxi-test-3 -- ls -la /dev/cxi*
#   kubectl exec cxi-test-3 -- env | grep -E 'SLINGSHOT|FI_'
#   kubectl exec cxi-test-3 -- fi_info --provider cxi
#   kubectl exec cxi-test-3 -- ldd /fi/bin/fi_pingpong | grep -E 'libfabric|libcxi'
#
# Cleanup:
#   kubectl delete pod cxi-test-3
---
apiVersion: v1
kind: Pod
metadata:
  name: cxi-test-3
  namespace: default
spec:
  restartPolicy: Never

  resourceClaims:
    - name: cxi
      resourceClaimTemplateName: cxi-small

  containers:
    - name: workload
      image: ubuntu:24.04
      command: ["sleep", "3600"]
      resources:
        claims:
          - name: cxi
      env:
        - name: PATH
          value: "/fi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      volumeMounts:
        - name: fi-install
          mountPath: /fi

  volumes:
    - name: fi-install
      hostPath:
        path: /home/vendor/pirese.vendor/source/libfabric/install
        type: Directory
