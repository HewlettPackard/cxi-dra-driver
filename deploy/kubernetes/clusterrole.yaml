apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cxi-dra-driver
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    # Authorises the UpdateStatus HTTP call itself.
    resources: ["resourceclaims/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    # "resourceclaims/driver" is a logical RBAC resource (no HTTP endpoint).
    # The DRA admission plugin does two SubjectAccessReviews when status.devices
    # is modified via UpdateStatus:
    #   1. verb=associated-node:update  (granted to kubelets by the NodeAuthorizer)
    #   2. verb=arbitrary-node:update   (granted to controllers/service-accounts here)
    # Standard "update"/"patch" verbs on this subresource do NOT satisfy either
    # check — the literal colon-verb strings must be granted explicitly.
    resources: ["resourceclaims/driver"]
    verbs: ["update", "patch", "associated-node:update", "arbitrary-node:update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # The namespace VNI allocator (leader-elected) watches every namespace, scans
  # for the cxi.slingshot.hpe.com/vni annotation, and patches an assignment onto
  # any namespace that lacks one. The kubelet plugin (prepare.go) Gets each pod's
  # namespace to resolve its VNI before recording it on the pod allocation.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cxi-dra-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cxi-dra-driver
subjects:
  - kind: ServiceAccount
    name: cxi-dra-driver
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxi-dra-driver
  namespace: kube-system
---
# Leader-election scaffolding for the namespace VNI allocator. Only one driver
# pod at a time assigns VNIs to namespaces; the rest wait. Scoped to a single
# Lease in kube-system so the ServiceAccount cannot read or overwrite
# control-plane leases (e.g. kube-scheduler / kube-controller-manager).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxi-vni-allocator-leader
  namespace: kube-system
rules:
  # "create" cannot be restricted by resourceName — the object does not exist yet.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cxi-vni-allocator-leader"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxi-vni-allocator-leader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cxi-vni-allocator-leader
subjects:
  - kind: ServiceAccount
    name: cxi-dra-driver
    namespace: kube-system
