apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cxi-dra-driver
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    # Authorises the UpdateStatus HTTP call itself.
    resources: ["resourceclaims/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    # "resourceclaims/driver" is a logical RBAC resource (no HTTP endpoint).
    # The DRA admission plugin does two SubjectAccessReviews when status.devices
    # is modified via UpdateStatus:
    #   1. verb=associated-node:update  (granted to kubelets by the NodeAuthorizer)
    #   2. verb=arbitrary-node:update   (granted to controllers/service-accounts here)
    # Standard "update"/"patch" verbs on this subresource do NOT satisfy either
    # check — the literal colon-verb strings must be granted explicitly.
    resources: ["resourceclaims/driver"]
    verbs: ["update", "patch", "associated-node:update", "arbitrary-node:update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # Reading the DaemonSet at startup to obtain its UID for ResourceSlice ownership.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cxi-dra-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cxi-dra-driver
subjects:
  - kind: ServiceAccount
    name: cxi-dra-driver
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxi-dra-driver
  namespace: kube-system
---
# VNI pool leader election is namespaced and scoped to the single lease the
# driver uses, so the ServiceAccount cannot read or overwrite control-plane
# leases (e.g. kube-scheduler / kube-controller-manager) in other namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxi-vni-pool-leader
  namespace: kube-system
rules:
  # "create" cannot be restricted by resourceName — the object does not exist yet.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cxi-vni-pool-leader"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxi-vni-pool-leader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cxi-vni-pool-leader
subjects:
  - kind: ServiceAccount
    name: cxi-dra-driver
    namespace: kube-system
