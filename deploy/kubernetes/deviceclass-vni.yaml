apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: cxi-vni
spec:
  selectors:
    - cel:
        expression: >
          device.driver == "cxi.slingshot.hpe.com" &&
          has(device.attributes["cxi.slingshot.hpe.com"].type) &&
          device.attributes["cxi.slingshot.hpe.com"].type == "vni"
