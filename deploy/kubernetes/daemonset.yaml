apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cxi-dra-driver
  namespace: kube-system
  labels:
    app: cxi-dra-driver
spec:
  selector:
    matchLabels:
      app: cxi-dra-driver
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cxi-dra-driver
    spec:
      serviceAccountName: cxi-dra-driver
      hostPID: true  # required for future netns inode querying
      priorityClassName: system-node-critical

      # Baseline seccomp profile. The driver container is privileged (it needs
      # raw access to /dev/cxi* and sysfs) so it runs unconfined at runtime, but
      # declaring the pod baseline satisfies Pod Security Standards and tooling.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      # Only schedule on nodes with CXI hardware.
      # Label nodes with: kubectl label node <node> feature.node.kubernetes.io/cxi=true
      nodeSelector:
        feature.node.kubernetes.io/cxi: "true"

      containers:
        - name: driver
          image: docker.io/pirese/cxi-dra-driver:dev
          imagePullPolicy: Always
          command:
            - /cxi-dra-driver
          args:
            - --driver-name=cxi.slingshot.hpe.com
            - --cdi-root=/var/run/cdi
            - --plugin-dir=/var/lib/kubelet/plugins/cxi.slingshot.hpe.com
            - --registrar-dir=/var/lib/kubelet/plugins_registry
            - --reserved-txqs=5
            - --reserved-tgqs=5
            - --reserved-eqs=10
            - --reserved-cts=0
            - --reserved-ptes=12
            - --reserved-acs=4
            - --reserved-le-pools=2
            - --reserved-tle-pools=1
            - --daemonset-name=cxi-dra-driver
            - --vni-range-start=100
            - --vni-range-end=300
            - --libfabric-lib=/opt/cray/libfabric/2.3.1/lib64/libfabric.so.1
            - --nccl-prefix=/projects/public/brics/dev/apps/linux-neoverse_v2/nccl-2.29.2-1-yjntbzz5uuuashekge53wqizfqum6swy
            - --aws-ofi-nccl-prefix=/projects/public/brics/dev/apps/linux-neoverse_v2/aws-ofi-nccl-1.18.0-6pbztrbjhvrmtu5r6nq2silgputmmcyk
            - --hwloc-lib=/projects/public/brics/dev/apps/linux-neoverse_v2/hwloc-2.12.2-xbbx7czzg3oczc3trftvj2dat3t6qj3o/lib/libhwloc.so.15
            - --pciaccess-lib=/projects/public/brics/dev/apps/linux-neoverse_v2/libpciaccess-0.17-yisowb26ojigtiis73t5dukyrvx7r6rk/lib/libpciaccess.so.0
            - --libxml2-lib=/projects/public/brics/dev/apps/linux-neoverse_v2/libxml2-2.13.5-xr3mgbb5y3midpndczeurgot35yosxkd/lib/libxml2.so.2
            - --libatomic-lib=/projects/public/brics/dev/apps/linux-neoverse_v2/gcc-runtime-14.3.0-4aynqrbkrzeranfuqhyfg7wktmszdenq/lib/libatomic.so.1
            - --liblzma-lib=/projects/public/brics/dev/apps/linux-neoverse_v2/xz-5.6.3-iqien4jp4hkpdks2rzyflpvgw3b72zqc/lib/liblzma.so.5
            - --libiconv-lib=/projects/public/brics/dev/apps/linux-neoverse_v2/libiconv-1.18-4ok6y76vboaxcwzvxwnwhc6uaxzookdp/lib/libiconv.so.2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true  # required to access /dev/cxi* and sysfs
            runAsUser: 0
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins/cxi.slingshot.hpe.com
            - name: kubelet-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: cdi
              mountPath: /var/run/cdi
            - name: nri
              mountPath: /var/run/nri
            - name: netns
              mountPath: /var/run/netns
              readOnly: true

      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins/cxi.slingshot.hpe.com
            type: DirectoryOrCreate
        - name: kubelet-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
