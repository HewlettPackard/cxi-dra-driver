apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cxi-dra-driver
  namespace: kube-system
  labels:
    app: cxi-dra-driver
spec:
  selector:
    matchLabels:
      app: cxi-dra-driver
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cxi-dra-driver
    spec:
      serviceAccountName: cxi-dra-driver
      hostPID: true  # required for future netns inode querying
      priorityClassName: system-node-critical

      # Baseline seccomp profile. The driver container is privileged (it needs
      # raw access to /dev/cxi* and sysfs) so it runs unconfined at runtime, but
      # declaring the pod baseline satisfies Pod Security Standards and tooling.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      # Only schedule on nodes with CXI hardware.
      # Label nodes with: kubectl label node <node> feature.node.kubernetes.io/cxi=true
      nodeSelector:
        feature.node.kubernetes.io/cxi: "true"

      containers:
        - name: driver
          image: ghcr.io/hewlettpackard/cxi-dra-driver:0.0.1
          imagePullPolicy: Always
          command:
            - /cxi-dra-driver
          args:
            - --driver-name=cxi.slingshot.hpe.com
            - --cdi-root=/var/run/cdi
            - --plugin-dir=/var/lib/kubelet/plugins/cxi.slingshot.hpe.com
            - --registrar-dir=/var/lib/kubelet/plugins_registry
            # Blessed system services present on every node: the default service
            # (svc_id 1) and the Ethernet service(s). Never torn down by the
            # driver, and their reserved resources are deducted from each
            # device's usable ceiling. Populate from `cxi_service list`.
            - --system-svc-ids=1,2,3,4
            # OPTIONAL SR-IOV VF mode: uncomment on nodes whose parent services
            # and VFs are already provisioned (see README § SR-IOV VF mode). The
            # driver then publishes one device per parent instead of PFs, and
            # ignores --system-svc-ids above (it logs a warning). Requires the
            # admission policies (deploy/kubernetes/admission-policy.yaml).
            # - --vf-only
            - --vni-range-start=100
            - --vni-range-end=300
            - --enable-cdi-env=true
            - --containerd-config-path=/etc/containerd/conf.d/50-cxi-cdi.toml
            - --env-config=/etc/cxi-dra/env.json
            # Per-pod synthetic /sys/class/net trees (HSN sysfs injection for
            # stock libfabric) are built under this host path; it must be mounted
            # writable at the same path below.
            - --netns-sysfs-root=/var/run/cxi/netns
            # Per-pod CNI hint files (the read-side contract for the
            # Slingshot CNI plugin) are written under this host path; it must
            # be mounted writable at the same path below.
            - --cni-hints-dir=/var/run/cxi/net-hints
            # OPTIONAL Slingshot CNI: uncomment to have the driver install the
            # bundled slingshot-cni binary onto the node's CNI_PATH at startup
            # (also uncomment the cni-bin volumeMount and volume below, and
            # apply deploy/kubernetes/cni/networkattachmentdefinition.yaml).
            # Requires Multus + Whereabouts on the cluster. Leave commented to
            # keep using hostNetwork for HSN access instead.
            # - --cni-install-dir=/opt/cni/bin
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true  # required to access /dev/cxi* and sysfs
            runAsUser: 0
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins/cxi.slingshot.hpe.com
            - name: kubelet-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: containerd-conf
              mountPath: /etc/containerd/conf.d
            - name: cdi
              mountPath: /var/run/cdi
            - name: nri
              mountPath: /var/run/nri
            - name: cxi-state
              mountPath: /var/run/cxi
            - name: netns
              mountPath: /var/run/netns
              readOnly: true
            - name: env-config
              mountPath: /etc/cxi-dra
              readOnly: true
            # - name: cni-bin
            #   mountPath: /opt/cni/bin

      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins/cxi.slingshot.hpe.com
            type: DirectoryOrCreate
        - name: kubelet-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
        - name: containerd-conf
          hostPath:
            path: /etc/containerd/conf.d
            type: DirectoryOrCreate
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: cxi-state
          hostPath:
            path: /var/run/cxi
            type: DirectoryOrCreate
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        - name: env-config
          configMap:
            name: cxi-dra-driver-env
        # - name: cni-bin
        #   hostPath:
        #     path: /opt/cni/bin
        #     type: DirectoryOrCreate
