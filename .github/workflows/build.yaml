name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "Dockerfile.mock"
      - ".dockerignore"
      - ".github/workflows/build.yaml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.mock"
      - ".dockerignore"
      - ".github/workflows/build.yaml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"

# Runners, registry, and credentials come from repo variables/secrets
# (Settings > Secrets and variables > Actions); nothing is hard-coded here.
env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  # Buildx gha cache needs the Actions cache service; opt in with BUILD_CACHE_GHA=true.
  CACHE_GHA: ${{ vars.BUILD_CACHE_GHA == 'true' }}

jobs:
  check:
    runs-on: ${{ fromJSON(vars.RUNNER_DEFAULT) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Separate from vet so a blocked module proxy shows up here, quickly and
      # with the offending URL in the log, instead of as a silent vet hang.
      - name: Download modules
        timeout-minutes: 10
        run: |
          go env GOPROXY GOSUMDB GONOSUMDB GOFLAGS
          go mod download -x

      # Untagged build only: vetting the cxi path needs libcxi headers, which
      # the container build covers by compiling it for real.
      # The -v list is dependencies being compiled, not vetted; vet needs
      # their export data and there is no way to skip that. -p 1 and a low
      # GOGC trade speed for peak memory on sub-1 GB, swapless runners.
      - name: Vet
        timeout-minutes: 45
        env:
          GOGC: 25
        run: |
          nproc; free -m; df -h "$(go env GOCACHE)"
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max 2>/dev/null || true
          go vet -v -p 1 ./...

      - name: Test
        timeout-minutes: 30
        env:
          GOGC: 25
        run: go test -p 1 ./...

