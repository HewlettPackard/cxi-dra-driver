name: Release Helm chart

# Lints the chart on every PR that touches it, and releases it from main.
# The release runs after build.yaml has succeeded for the same commit, so the
# short-SHA image that this workflow promotes to the official version tag is
# guaranteed to exist. Nothing is published unless Chart.yaml's version has
# not been released yet, so a release is cut by bumping `version` (and
# `appVersion` for a new driver image) in Chart.yaml and merging.
on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/release-chart.yaml"
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Published with the workflow's own GITHUB_TOKEN; no repository secrets or
# variables are needed. GHCR names must be lowercase, so they are spelled out
# rather than derived from github.repository. The chart lives under charts/ so
# it cannot collide with the image, which helm push would otherwise do since
# both are named cxi-dra-driver.
env:
  CHART_DIR: deploy/helm/cxi-dra-driver
  REGISTRY: ghcr.io
  CHART_REPO: hewlettpackard/charts
  IMAGE_NAME: hewlettpackard/cxi-dra-driver
  # The commit being released: the one Build just finished for, or HEAD of the
  # dispatched ref.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read

jobs:
  # Public GitHub only, for the same reason as build.yaml's `check` job: the
  # internal mirror has no hosted runners. `release` needs this job and is
  # skipped along with it.
  lint:
    name: Lint and template
    if: >-
      github.repository == 'HewlettPackard/cxi-dra-driver' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      # Rendering catches template errors that `helm lint` alone will not,
      # and covers both workload kinds since they share no template path.
      - name: Template (DaemonSet, defaults)
        run: helm template cxi ${{ env.CHART_DIR }} > /dev/null

      - name: Template (Deployment, alternate driver name)
        run: |
          helm template cxi-next ${{ env.CHART_DIR }} \
            --set workload.kind=Deployment \
            --set driverName=cxi.next.hpe.com > /dev/null

      # The CNI templates are opt-in and render nothing by default.
      - name: Template (Slingshot CNI enabled)
        run: |
          helm template cxi-cni ${{ env.CHART_DIR }} \
            --set cni.install=true \
            --set cni.nad.create=true \
            --set 'cni.nad.namespaces={default}' > /dev/null

  # The chart is distributed as an OCI artifact in the container registry, not
  # as an HTTP chart repository, so it needs no gh-pages branch or GitHub
  # Pages and authenticates the same way as the image.
  release:
    name: Package and publish
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and its tag
      packages: write # push the chart and the official image tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0 # need tags to tell whether this version is released

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Read chart version
        id: chart
        run: |
          name=$(helm show chart "$CHART_DIR" | yq -r '.name')
          version=$(helm show chart "$CHART_DIR" | yq -r '.version')
          app_version=$(helm show chart "$CHART_DIR" | yq -r '.appVersion')
          {
            echo "name=$name"
            echo "version=$version"
            echo "app_version=$app_version"
            echo "short_sha=${RELEASE_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$name-$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name-$version is already released; bump version in $CHART_DIR/Chart.yaml to publish a new one."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.chart.outputs.released == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This is the only place the official image version is set. The
      # short-SHA image built by build.yaml for this commit is retagged with
      # the chart's appVersion; the tag is immutable, so if it already exists
      # (chart bumped without a new appVersion) it is left alone.
      - name: Tag the release image
        if: steps.chart.outputs.released == 'false'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          APP_VERSION: ${{ steps.chart.outputs.app_version }}
          SHORT_SHA: ${{ steps.chart.outputs.short_sha }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${APP_VERSION}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${APP_VERSION} already exists; not retagging. Bump appVersion in ${CHART_DIR}/Chart.yaml to release a new image."
            exit 0
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${APP_VERSION}" \
            "${IMAGE}:${SHORT_SHA}"
          docker buildx imagetools inspect "${IMAGE}:${APP_VERSION}"

      - name: Package
        if: steps.chart.outputs.released == 'false'
        run: helm package "$CHART_DIR" --destination /tmp/chart

      - name: Push chart
        if: steps.chart.outputs.released == 'false'
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "/tmp/chart/${CHART}-${VERSION}.tgz" \
            "oci://${REGISTRY}/${CHART_REPO}"

      # Published after the push, so a failed push does not leave a release
      # advertising a chart that is not there. The tarball is attached for
      # archival; the OCI reference is the supported way to install.
      - name: Create GitHub release
        if: steps.chart.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          APP_VERSION: ${{ steps.chart.outputs.app_version }}
        run: |
          notes=$(cat <<EOF
          Helm chart \`${CHART}\` ${VERSION}, driver image \`${REGISTRY}/${IMAGE_NAME}:${APP_VERSION}\`.

          \`\`\`bash
          helm install cxi oci://${REGISTRY}/${CHART_REPO}/${CHART} --version ${VERSION} -n kube-system
          \`\`\`
          EOF
          )
          gh release create "${CHART}-${VERSION}" \
            --target "${RELEASE_SHA}" \
            --title "${CHART} ${VERSION}" \
            --notes "$notes" \
            "/tmp/chart/${CHART}-${VERSION}.tgz"
