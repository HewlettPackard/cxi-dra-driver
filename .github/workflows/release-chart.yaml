name: Release Helm chart

# Disabled for automatic runs until the chart registry on GHES is settled;
# manual dispatch only. Restore the push/pull_request triggers (see git
# history) to re-enable PR charts and releases.
on:
  workflow_dispatch:

# Runner, registry, and credentials come from the same repo variables/secrets
# as build.yaml; CHART_REPO is the OCI path under REGISTRY the chart is pushed to.
env:
  CHART_DIR: deploy/helm/cxi-dra-driver
  REGISTRY: ${{ vars.REGISTRY }}
  CHART_REPO: ${{ vars.CHART_REPO }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and template
    runs-on: ${{ fromJSON(vars.RUNNER_DEFAULT) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      # Rendering catches template errors that `helm lint` alone will not,
      # and covers both workload kinds since they share no template path.
      - name: Template (DaemonSet, defaults)
        run: helm template cxi ${{ env.CHART_DIR }} > /dev/null

      - name: Template (Deployment, alternate driver name)
        run: |
          helm template cxi-next ${{ env.CHART_DIR }} \
            --set workload.kind=Deployment \
            --set driverName=cxi.next.hpe.com > /dev/null

      # The CNI templates are opt-in and render nothing by default.
      - name: Template (Slingshot CNI enabled)
        run: |
          helm template cxi-cni ${{ env.CHART_DIR }} \
            --set cni.install=true \
            --set cni.nad.create=true \
            --set 'cni.nad.namespaces={default}' > /dev/null
  # Same-repo PRs publish a prerelease chart, <version>-pr.<number>, the chart
  # counterpart of build.yaml's pr-<number> image tag, so a PR can be
  # test-deployed end to end without merging. Like the image tag it is
  # re-pushed on every commit to the PR. Fork PRs are excluded for the same
  # reason build.yaml excludes them from pushing.
  pr-chart:
    name: Publish PR chart
    needs: lint
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.RUNNER_DEFAULT) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff against the base branch below

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Pin the chart to the pr-<number> image only when this PR changes an
      # image input, because build.yaml publishes that tag only then. A
      # chart-only PR keeps the default image tag so it never points at an
      # image that does not exist. Keep this pattern in sync with build.yaml's
      # paths filter.
      - name: Point the chart at this PR
        id: chart
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          name=$(yq -r '.name' "$CHART_DIR/Chart.yaml")
          version="$(yq -r '.version' "$CHART_DIR/Chart.yaml")-pr.${PR}"
          yq -i ".version = \"${version}\"" "$CHART_DIR/Chart.yaml"
          image_re='^(Dockerfile|Dockerfile\.mock|\.dockerignore|\.github/workflows/build\.yaml|go\.mod|go\.sum|cmd/|internal/)'
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE "$image_re"; then
            yq -i ".appVersion = \"pr-${PR}\"" "$CHART_DIR/Chart.yaml"
            yq -i ".image.tag = \"pr-${PR}\"" "$CHART_DIR/values.yaml"
            image_tag="pr-${PR}"
          else
            image_tag=$(yq -r '.image.tag' "$CHART_DIR/values.yaml")
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Package
        run: helm package "$CHART_DIR" --destination /tmp/chart

      - name: Log in to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Push chart
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "/tmp/chart/${CHART}-${VERSION}.tgz" \
            "oci://${REGISTRY}/${CHART_REPO}"

      - name: Summary
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          IMAGE_TAG: ${{ steps.chart.outputs.image_tag }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          PR chart \`${CHART}\` ${VERSION} (image tag \`${IMAGE_TAG}\`):

          \`\`\`bash
          helm upgrade --install cxi oci://${REGISTRY}/${CHART_REPO}/${CHART} --version ${VERSION}
          \`\`\`
          EOF

  # The chart is distributed as an OCI artifact in the container registry, not
  # as an HTTP chart repository. An HTTP repo would mean a gh-pages branch plus
  # GitHub Pages, and on a private repo that combination does not work: the
  # Pages site is served publicly (access control is Enterprise Cloud only)
  # while the index.yaml it serves points at release assets that need
  # authentication. OCI needs no Pages and authenticates uniformly.
  release:
    name: Package and publish
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_DEFAULT) }}
    permissions:
      contents: write # create the release and its tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to tell whether this version is released

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Read chart version
        id: chart
        run: |
          name=$(helm show chart "$CHART_DIR" | yq -r '.name')
          version=$(helm show chart "$CHART_DIR" | yq -r '.version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$name-$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name-$version is already released; bump version in $CHART_DIR/Chart.yaml to publish a new one."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.chart.outputs.released == 'false'
        run: helm package "$CHART_DIR" --destination /tmp/chart

      - name: Log in to registry
        if: steps.chart.outputs.released == 'false'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Push chart
        if: steps.chart.outputs.released == 'false'
        env:
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "/tmp/chart/${CHART}-${VERSION}.tgz" \
            "oci://${REGISTRY}/${CHART_REPO}"

      # Published after the push, so a failed push does not leave a release
      # advertising a chart that is not there. The tarball is attached for
      # archival; the OCI reference is the supported way to install.
      - name: Create GitHub release
        if: steps.chart.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          # gh defaults to github.com; point it at this instance (GHES or not).
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          notes=$(cat <<EOF
          Helm chart \`${CHART}\` ${VERSION}.

          \`\`\`bash
          helm install cxi oci://${REGISTRY}/${CHART_REPO}/${CHART} --version ${VERSION}
          \`\`\`

          If the registry is private, authenticate first:

          \`\`\`bash
          helm registry login ${REGISTRY} -u <username>
          \`\`\`
          EOF
          )
          gh release create "${CHART}-${VERSION}" \
            --title "${CHART} ${VERSION}" \
            --notes "$notes" \
            "/tmp/chart/${CHART}-${VERSION}.tgz"
